pluginManagement {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'TerraForged-Fabric'

// The NeoForge build compiles the same sources as the Fabric build (the root project); see
// neoforge/build.gradle.
include 'neoforge'
