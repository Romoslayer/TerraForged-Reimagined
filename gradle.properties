# Gradle
org.gradle.jvmargs = -Xmx4G
org.gradle.daemon = false

# Mod Properties
mod_id = terraforged
mod_name = TerraForged Reimagined
archives_name = terraforged-reimagined
mod_version = 0.4.2
maven_group = com.terraforged

# Minecraft
mc_version = 1.20.1
java_version = 17

# Fabric
loader_version = 0.19.5
fabric_version = 0.92.12

# NeoForge (neoforge/)
neoforge_version = 1.20.1-47.1.106
moddev_version = 2.0.148
# Minecraft versions the NeoForge jar declares it runs on (neoforge.mods.toml).
neoforge_mc_version_range = [1.20.1,1.20.2)

# Forge (forge/)
forge_version = 1.20.1-47.4.26
forgegradle_version = 7.0.40
# Minecraft versions the Forge jar declares it runs on (mods.toml).
forge_mc_version_range = [1.20.1,1.20.2)
# Forge dev runs need classes and resources in one folder, or the launcher finds mods.toml but no
# classes ("constructed 0 mods").
net.minecraftforge.gradle.merge-source-sets = true

# Mixin
mixin_extras_version = 0.5.4

# Optional: install the built jar into a Minecraft instance after every build. Set this in your
# user-level ~/.gradle/gradle.properties rather than here, since the path is specific to your machine:
#   terraforged.deploy.fabric.1.20.1 = C:/path/to/instance/mods
# Unset, or pointing at a directory that does not exist, the deploy step is skipped.
