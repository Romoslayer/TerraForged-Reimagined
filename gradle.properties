# Gradle
org.gradle.jvmargs = -Xmx4G
org.gradle.daemon = false

# Mod Properties
mod_id = terraforged
mod_name = TerraForged Reimagined
archives_name = terraforged-reimagined
mod_version = 0.4.0
maven_group = com.terraforged

# Minecraft
mc_version = 26.3
java_version = 25

# Fabric
loader_version = 0.19.5
fabric_version = 0.161.0

# NeoForge (neoforge/)
neoforge_version = 26.2.0.88
moddev_version = 2.0.147
# Minecraft versions the NeoForge jar declares it runs on (neoforge.mods.toml).
neoforge_mc_version_range = [26.2,26.3)

# Mixin
mixin_extras_version = 0.5.4

# Optional: install the built jar into a Minecraft instance after every build. Set this in your
# user-level ~/.gradle/gradle.properties rather than here, since the path is specific to your machine:
#   terraforged.deploy.fabric.26.2 = C:/path/to/instance/mods
# Unset, or pointing at a directory that does not exist, the deploy step is skipped.
